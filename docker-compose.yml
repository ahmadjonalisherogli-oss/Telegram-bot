version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: restaurant_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_password
      POSTGRES_DB: restaurant_bot_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d restaurant_bot_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Redis for FSM Storage and Caching
  redis:
    image: redis:7-alpine
    container_name: restaurant_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Telegram Bot Service
  telegram_bot:
    build: .
    container_name: restaurant_bot
    restart: always
    env_file:
      - .env
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=restaurant_bot_db
      - DB_USER=postgres
      - DB_PASS=postgres_password
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres_password@postgres:5432/restaurant_bot_db
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
